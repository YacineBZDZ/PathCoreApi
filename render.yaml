services:
  - type: web
    name: anomaly-detection-api
    runtime: python
    region: frankfurt          # closest to Toulouse
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /
